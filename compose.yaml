services:
  app:
    build: .
    volumes:
      - .:/var/www
    ports:
      - '8000:8000'
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - '3306:3306'

  node:
    image: node:20
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
